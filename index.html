<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Our Netherlands Pop-Up Kitchens</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Leaflet.js CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <style>
        @font-face {
            font-family: 'NewSpirit';
            src: url('https://firebasestorage.googleapis.com/v0/b/homemademeals-7040d.appspot.com/o/fonts%2FNewSpirit-BoldCondensed.ttf?alt=media&token=c8efe058-eff2-4ae3-937e-5ec9d0d760cd') format('truetype');
            font-weight: bold;
            font-style: normal;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: #F8F9FA;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* Custom scrollbar for premium sidebar feel */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #E4E4E7;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #D4D4D8;
        }

        /* Glassmorphism Details Card */
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        /* Pulse Animation for Map Marker Rings */
        @keyframes custom-pulse {
            0% {
                transform: scale(0.85);
                opacity: 0.7;
            }
            50% {
                transform: scale(1.3);
                opacity: 0.2;
            }
            100% {
                transform: scale(0.85);
                opacity: 0.7;
            }
        }

        .glowing-marker {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .glowing-marker-core {
            width: 14px;
            height: 14px;
            background-color: #F47A42;
            border: 2.5px solid #FFFFFF;
            border-radius: 50%;
            box-shadow: 0 0 12px rgba(244, 122, 66, 0.8);
            z-index: 10;
        }
        .glowing-marker-ring {
            position: absolute;
            border-radius: 50%;
            background-color: rgba(244, 122, 66, 0.2);
            border: 1.5px solid rgba(244, 122, 66, 0.5);
            animation: custom-pulse 2.5s infinite ease-in-out;
            z-index: 5;
        }

        /* Brightened Leaflet Map filter to make canvas look incredibly clean and vibrant */
        .bright-map {
            filter: saturate(1.15) brightness(1.02) contrast(1.01);
        }
    </style>
</head>
<body class="bg-[#F8F9FA]">

            <!-- Search Field -->
            <div class="px-4 md:px-6 py-3 bg-zinc-50 border-b border-zinc-100">

                    <input id="search-input" type="text" placeholder="Search city or chef specialties..." class="w-full pl-10 pr-4 py-2.5 bg-white border border-zinc-200 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-orange-500/20 focus:border-[#F47A42] transition-all shadow-sm">
                    <svg class="absolute left-3.5 top-3.5 h-4 w-4 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </div>
            </div>

            <!-- Leaderboard & Scrollable Area -->
            <div id="city-list-container" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-3 md:space-y-4">

                    <span>Coverage Leaderboard</span>

                <span>Data Ref: Active June 2026</span>

            </div>
        </div>

        <!-- Interactive Map Container -->
        <div class="flex-1 h-full relative">
            <div id="map" class="w-full h-full bg-zinc-100 bright-map"></div>

            <!-- Floating Translucent Details overlay card -->
            <div id="detail-card" class="absolute bottom-6 left-6 right-6 md:right-auto md:w-[420px] glass-panel rounded-3xl p-6 shadow-2xl z-[1000] transform translate-y-12 opacity-0 pointer-events-none transition-all duration-300">
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <span id="detail-province" class="text-[10px] uppercase font-bold tracking-widest text-[#F47A42]"></span>
                        <h2 id="detail-city" class="text-2xl font-extrabold text-zinc-900 leading-tight" style="font-family: 'NewSpirit', sans-serif;"></h2>
                    </div>
                    <button id="close-detail" class="text-zinc-400 hover:text-zinc-600 p-2 hover:bg-zinc-100/80 rounded-full transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>

                <!-- List of chefs in the selected city -->
                <div id="detail-chefs-list" class="space-y-3 max-h-[220px] overflow-y-auto pr-1">
                    <!-- Dynamic popup contents -->
                </div>
            </div>
        </div>
    </div>

                ]
            },

                chefs: [
                    { name: "Hengelo spice road", specialty: "Vada Pav & Vegetable samosas", rating: 4.9 }
                ]
            },
            "Hazerswoude-Rijndijk": {
                lat: 52.1292, lng: 4.5937, count: 1, province: "South Holland",
                chefs: [

                ]
            },

                chefs: [
                    { name: "Bohemian Lotus", specialty: "Miso glazed eggplant & gyozas", rating: 4.9 }
                ]
            }
        };

        // Initialize bright tilemap system
        const map = L.map('map', {
            zoomControl: false,
            attributionControl: false
        }).setView([52.25, 5.4], 7.5);

        // Standard crisp white light maps tile layer
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            maxZoom: 19
        }).addTo(map);

        // Fetch and draw provincial boundaries as dashed vector overlays
        fetch('https://raw.githubusercontent.com/johan/world.geo.json/master/countries/NLD/provinces.geo.json')
            .then(res => res.json())
            .then(geoData => {
                L.geoJSON(geoData, {
                    style: function(feature) {
                        return {
                            color: '#F47A42',
                            weight: 1.5,
                            opacity: 0.45,
                            fillColor: '#F47A42',
                            fillOpacity: 0.015,
                            dashArray: '5, 6'
                        };
                    }
                }).addTo(map);
            });

        const markers = {};
        const maxChefCount = 24; // Amsterdam maximum count for scaling math

        // Function to create proportional, highly-visible pulsing city markers
        function createCityIcon(count) {
            // Highly dramatic scaling: scales aggressively up to 135px for massive density hubs
            const size = Math.max(22, 18 + (count * 4.8));
            // Translucency of the outer halo subtly deepens as density increases
            const haloOpacity = Math.min(0.5, 0.15 + (count * 0.012));
            const borderOpacity = Math.min(0.8, 0.3 + (count * 0.015));
            
            return L.divIcon({
                className: 'glowing-marker-container',
                html: `
                    <div class="glowing-marker" style="width: ${size}px; height: ${size}px;">
                        <div class="glowing-marker-ring" style="width: ${size}px; height: ${size}px; background-color: rgba(244, 122, 66, ${haloOpacity}); border: 1.5px solid rgba(244, 122, 66, ${borderOpacity});"></div>
                        <div class="glowing-marker-core"></div>
                    </div>
                `,
                iconSize: [size, size],
                iconAnchor: [size/2, size/2]
            });
        }

        // Insert markers on the Leaflet instance
        Object.keys(platformData).forEach(cityName => {
            const data = platformData[cityName];
            const marker = L.marker([data.lat, data.lng], {
                icon: createCityIcon(data.count)
            }).addTo(map);

            // Bind crisp elegant tooltips
            marker.bindTooltip(`
                <div class="px-3 py-1.5 text-xs font-semibold text-zinc-900 bg-white rounded-xl shadow-md border border-zinc-100/80 flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-[#F47A42]"></span>
                    <span><b>${cityName}</b>: ${data.count} chef${data.count > 1 ? 's' : ''}</span>
                </div>
            `, {
                direction: 'top',
                offset: [0, -12],
                opacity: 1.0,
                className: 'bg-transparent border-none shadow-none'
            });

            marker.on('click', () => {
                selectCity(cityName);
            });

            markers[cityName] = marker;
        });

        // Renders visual leaderboard matched perfectly to the provided snapshot specifications
        function renderCityList(filter = '') {
            const container = document.getElementById('city-list-container');
            container.innerHTML = `
                <div class="text-[10px] font-bold text-zinc-400 uppercase tracking-widest flex justify-between px-1 mb-2">
                    <span>Coverage Leaderboard</span>
                    <span>Chefs</span>
                </div>
            `;

            const query = filter.toLowerCase();
            const sortedCities = Object.keys(platformData)
                .filter(city => city.toLowerCase().includes(query) || 
                    platformData[city].chefs.some(c => c.name.toLowerCase().includes(query) || c.specialty.toLowerCase().includes(query)))
                .sort((a, b) => platformData[b].count - platformData[a].count);

            sortedCities.forEach(city => {
                const data = platformData[city];
                const card = document.createElement('div');
                card.className = "bg-white p-4 rounded-2xl border border-zinc-200/60 shadow-sm hover:shadow-md cursor-pointer transition-all duration-200 flex justify-between items-center group relative overflow-hidden";
                
                // Construct structure exactly matching Screenshot reference
                card.innerHTML = `
                    <div class="flex-1 min-w-0 pr-4">
                        <span class="text-[9px] uppercase tracking-wider font-extrabold text-zinc-400 group-hover:text-[#F47A42] transition-colors">${data.province}</span>
                        <h3 class="text-sm md:text-base font-extrabold text-zinc-800 tracking-tight leading-snug mt-0.5">${city}</h3>
                        <!-- Decorative Brand Bar directly below the City Title matching reference -->
                        <div class="w-8 h-1 bg-[#F47A42] rounded-full mt-2 transition-all duration-300 group-hover:w-16"></div>
                    </div>
                    <div class="shrink-0">
                        <span class="px-3.5 py-1.5 text-xs font-black bg-zinc-100 text-zinc-700 rounded-full group-hover:bg-orange-50 group-hover:text-[#F47A42] transition-colors">
                            ${data.count}
                        </span>
                    </div>
                `;

                card.addEventListener('click', () => {
                    selectCity(city);
                });

                container.appendChild(card);
            });
        }

        // Action triggered when focusing a specific city node
        function selectCity(cityName) {
            const data = platformData[cityName];
            if (!data) return;

            // Pan/Fly map smoothly using animated transition coordinates offset slightly north
            map.flyTo([data.lat - 0.04, data.lng], 10, {
                animate: true,
                duration: 1.4
            });

            // Populate the floating card overlay with beautiful listings
            const card = document.getElementById('detail-card');
            document.getElementById('detail-province').innerText = data.province;
            document.getElementById('detail-city').innerText = cityName;

            const chefsList = document.getElementById('detail-chefs-list');
            chefsList.innerHTML = '';

            data.chefs.forEach(chef => {
                const chefRow = document.createElement('div');
                chefRow.className = "p-4 bg-white/80 border border-zinc-200/50 rounded-2xl hover:bg-white transition-all flex items-start gap-3.5 shadow-sm";
                chefRow.innerHTML = `
                    <div class="w-10 h-10 rounded-full bg-orange-50 flex items-center justify-center text-sm font-bold text-[#F47A42] shrink-0 border border-orange-100">
                        ${chef.name.substring(0, 2).toUpperCase()}
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex justify-between items-center">
                            <h4 class="text-sm font-bold text-zinc-800 truncate">${chef.name}</h4>
                            <span class="text-[11px] font-bold text-amber-600 flex items-center gap-0.5">⭐ ${chef.rating}</span>
                        </div>
                        <p class="text-[11px] text-zinc-500 truncate mt-1">${chef.specialty}</p>
                    </div>
                `;
                chefsList.appendChild(chefRow);
            });

            card.classList.remove('opacity-0', 'translate-y-12', 'pointer-events-none');
            card.classList.add('opacity-100', 'translate-y-0');
        }

        // Close Pop-Up details frame
        document.getElementById('close-detail').addEventListener('click', () => {
            const card = document.getElementById('detail-card');
            card.classList.remove('opacity-100', 'translate-y-0');
            card.classList.add('opacity-0', 'translate-y-12', 'pointer-events-none');
            map.setView([52.25, 5.4], 7.5);
        });

        // Initialize user interaction controls
        document.getElementById('search-input').addEventListener('input', (e) => {
            renderCityList(e.target.value);
        });

        renderCityList();
