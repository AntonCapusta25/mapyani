<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amsterdam & Enschede Restaurants - Food Spots Map</title>
    <meta name="description"
        content="Discover the best restaurants in Amsterdam and Enschede with interactive Leaflet map, districts, reviews, and filters.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

    <!-- Leaflet.js -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- Leaflet MarkerCluster -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

    <!-- Leaflet Heat -->
    <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>

    <!-- App Styles -->
    <link rel="stylesheet" href="./styles.css">
</head>

<body>
    <!-- Animated Background -->
    <div class="background-animation"></div>

    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <span class="logo-icon">🍽️</span>
                <h1 id="appHeaderTitle">Amsterdam & Enschede Restaurants</h1>
            </div>

            <!-- City Switcher -->
            <div class="city-toggle-container">
                <button class="city-btn active" id="btnCityAmsterdam" onclick="selectCity('amsterdam')">
                    🏛️ Amsterdam (4,976)
                </button>
                <button class="city-btn" id="btnCityEnschede" onclick="selectCity('enschede')">
                    📍 Enschede (834)
                </button>
            </div>

            <div class="stats-bar" id="statsBar">
                <div class="stat-item">
                    <div class="stat-value" id="totalRestaurants">0</div>
                    <div class="stat-label">Restaurants</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="avgRating">0</div>
                    <div class="stat-label">Avg Rating</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="totalReviews">0</div>
                    <div class="stat-label">Reviews</div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="container">
        <!-- Controls -->
        <section class="controls">
            <div class="controls-grid">
                <div class="control-group">
                    <label for="searchInput">🔍 Search</label>
                    <input type="text" id="searchInput" placeholder="Search by name, address, or cuisine...">
                </div>

                <div class="control-group">
                    <label for="districtFilter">📍 District / Area</label>
                    <select id="districtFilter">
                        <option value="">All Districts</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="cuisineFilter">🍴 Cuisine Type</label>
                    <select id="cuisineFilter">
                        <option value="">All Cuisines</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="minRating">⭐ Minimum Rating</label>
                    <select id="minRating">
                        <option value="">Any Rating</option>
                        <option value="4.5">4.5+ Stars</option>
                        <option value="4.0">4.0+ Stars</option>
                        <option value="3.5">3.5+ Stars</option>
                        <option value="3.0">3.0+ Stars</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="sortBy">📊 Sort By</label>
                    <select id="sortBy">
                        <option value="rating">Highest Rating</option>
                        <option value="reviews">Most Reviews</option>
                        <option value="name">Name (A-Z)</option>
                    </select>
                </div>
            </div>

            <div class="button-group">
                <button class="btn btn-primary" id="applyFilters">
                    ✨ Apply Filters
                </button>
                <button class="btn btn-secondary" id="resetFilters">
                    🔄 Reset
                </button>
            </div>
        </section>

        <!-- Map Section with Interactive Layer Controls -->
        <section class="map-section" style="position: relative;">
            <div class="hz-live-map__controls" style="position: absolute; top: 16px; left: 16px; z-index: 1000; display: flex; gap: 8px; align-items: center; background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(10px); padding: 6px 12px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.18); box-shadow: 0 4px 20px rgba(0,0,0,0.5);">
                <div class="hz-map-tabs" style="display: flex; gap: 6px;">
                    <button type="button" class="hz-map-tab" id="btnTabAll" onclick="setMapMode('all')" style="display: flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 999px; border: none; font-weight: 700; font-size: 0.85rem; cursor: pointer; transition: all 0.2s; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; box-shadow: 0 2px 8px rgba(102, 126, 234, 0.4);">
                        <span class="material-symbols-outlined" style="font-size: 18px;">map</span>
                        <span>Districts & Venues</span>
                    </button>
                    <button type="button" class="hz-map-tab" id="btnTabDistricts" onclick="setMapMode('districts')" style="display: flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 999px; border: none; font-weight: 600; font-size: 0.85rem; cursor: pointer; transition: all 0.2s; background: transparent; color: #a0aec0;">
                        <span class="material-symbols-outlined" style="font-size: 18px;">grid_view</span>
                        <span>Districts Only</span>
                    </button>
                    <button type="button" class="hz-map-tab" id="btnTabHeatmap" onclick="setMapMode('heatmap')" style="display: flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 999px; border: none; font-weight: 600; font-size: 0.85rem; cursor: pointer; transition: all 0.2s; background: transparent; color: #a0aec0;">
                        <span class="material-symbols-outlined" style="font-size: 18px;">layers</span>
                        <span>Heatmap</span>
                    </button>
                </div>
            </div>

            <div id="map" style="height: 800px !important; width: 100%;"></div>
        </section>

        <!-- Active District Filter Banner -->
        <div id="activeDistrictBanner" style="display: none; align-items: center; justify-content: space-between; background: linear-gradient(135deg, rgba(102, 126, 234, 0.25) 0%, rgba(118, 75, 162, 0.25) 100%); border: 1px solid rgba(102, 126, 234, 0.6); padding: 12px 20px; border-radius: 12px; margin: 15px 0 20px 0;">
            <div style="display: flex; align-items: center; gap: 12px;">
                <span style="font-size: 1.5rem;">📍</span>
                <div>
                    <div style="font-weight: 700; color: #ffffff; font-size: 1rem;" id="activeDistrictTitle">Filtered by District</div>
                    <div style="font-size: 0.82rem; color: #cbd5e1;" id="activeDistrictSubtitle">Showing venues in this area</div>
                </div>
            </div>
            <button onclick="clearDistrictFilter()" style="padding: 7px 16px; background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.35); border-radius: 999px; color: #fff; font-size: 0.82rem; font-weight: 700; cursor: pointer; transition: all 0.2s;">
                ✕ Clear District Filter
            </button>
        </div>

        <section class="filters-section">
            <div class="header-controls">
                <button id="reloadData" class="btn btn-secondary">
                    🔄 Reload Data
                </button>
                <button id="exportData" class="btn btn-primary">
                    📥 Export CSV
                </button>
            </div>
        </section>

        <!-- Results Info -->
        <div class="results-info">
            <div class="results-count">
                Showing <span id="resultsCount">0</span> restaurants
            </div>
        </div>

        <!-- Loading State -->
        <div class="loading" id="loadingState" style="display: none;">
            <div class="spinner"></div>
            <p>Loading restaurants...</p>
        </div>

        <!-- Empty State -->
        <div class="empty-state" id="emptyState" style="display: none;">
            <div class="empty-icon">🍽️</div>
            <h2>No restaurants found</h2>
            <p>Try adjusting your filters or search criteria</p>
        </div>

        <!-- Restaurants Grid -->
        <div class="restaurants-grid" id="restaurantsGrid"></div>
    </main>

    <!-- JavaScript -->
    <script src="./app.js"></script>
</body>

</html>
